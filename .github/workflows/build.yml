name: Build Android Release APK

on:
  # push:
  #   branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Configs, Keystore and Wrapper
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing in Repository Secrets!"
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::STORE_PASSWORD or KEY_PASSWORD secret is missing!"
            exit 1
          fi

          if [ ! -f ".env.example" ]; then
            echo 'GEMINI_API_KEY=""' > .env.example
          fi
          if [ ! -f ".env" ]; then
            echo 'GEMINI_API_KEY="AIzaSyTestKeyForBuild"' > .env
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          cp my-upload-key.jks app/my-upload-key.jks
          
          if [ ! -s "my-upload-key.jks" ]; then
            echo "::error::my-upload-key.jks is empty or corrupted!"
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: ./gradlew assembleRelease -x lint -x test --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Factor-Hamrah-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
